; Per-directory PHP settings, read by PHP-FPM (not by `php -S`; run.sh passes the
; same limits via -d). Kept here instead of php.ini so they travel with the repo.
; Apache must not serve this file — see deploy/bug-report.conf.

; Above the app's 5MB cap, so the app's own size error is what the user sees.
upload_max_filesize = 6M
; Two screenshots (edit.php) plus form fields.
post_max_size = 13M

; Never leak errors/stack traces to visitors; log them instead.
display_errors = Off
log_errors = On
